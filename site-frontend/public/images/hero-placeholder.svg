<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="">
  <defs>
    <linearGradient id="hp-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#201a1a"/>
      <stop offset="55%" stop-color="#201a1a"/>
      <stop offset="100%" stop-color="#3a1414"/>
    </linearGradient>
    <radialGradient id="hp-glow" cx="78%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#661615" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#550000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#201a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hp-vignette" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#hp-base)"/>
  <rect width="1920" height="1080" fill="url(#hp-glow)"/>

  <!-- Oversized, mostly-cropped chevron motif (same 5-band mark language as
       src/components/SymbolBackground.tsx) — bleeds off the top/right edge,
       barely-there tonal contrast rather than a literal photo. -->
  <g opacity="0.5" stroke="#ffffff" stroke-opacity="0.06" stroke-width="26" fill="none">
    <path d="M 1180 -80 L 1520 260 L 1180 600"/>
    <path d="M 1320 -80 L 1660 260 L 1320 600"/>
    <path d="M 1460 -80 L 1800 260 L 1460 600"/>
    <path d="M 1600 -80 L 1940 260 L 1600 600"/>
    <path d="M 1740 -80 L 2080 260 L 1740 600"/>
  </g>

  <!-- Faint fine-line grid, sparse and low-contrast — a restrained
       "precision/technology" cue, not a literal dashboard grid. -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <rect width="1920" height="1080" fill="url(#hp-vignette)"/>
</svg>
