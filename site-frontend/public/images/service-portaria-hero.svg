<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" role="img" aria-label="Portaria e controle de acesso">
  <defs>
    <linearGradient id="bgSP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#661615"/>
      <stop offset="100%" stop-color="#201a1a"/>
    </linearGradient>
    <pattern id="gridSP" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="1400" fill="url(#bgSP)"/>
  <rect width="1200" height="1400" fill="url(#gridSP)"/>
  <g opacity="0.85" fill="none" stroke="#ffffff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- access gate / turnstile -->
    <path d="M420 520v420M780 520v420"/>
    <path d="M420 700h360"/>
    <path d="M540 700l-40 40M540 700l-40-40M660 700l40 40M660 700l40-40"/>
    <!-- access card reader panel -->
    <rect x="820" y="600" width="140" height="200" rx="10"/>
    <rect x="850" y="640" width="80" height="55" rx="6"/>
    <circle cx="890" cy="760" r="14"/>
  </g>
  <text x="80" y="1300" font-family="Arial, sans-serif" font-size="26" letter-spacing="3" fill="#ffffff" fill-opacity="0.35">IMAGEM ILUSTRATIVA — PORTARIA E CONTROLE DE ACESSO</text>
</svg>
